# LIRC options for the USB-UIRT infrared receiver/transmitter.
# Installed to /etc/lirc/lirc_options.conf by install.sh.
#
# The USB-UIRT is an FTDI serial device; it needs the usb_uirt_raw driver
# (the generic "default" driver expects a kernel /dev/lirc node and will NOT
# work). The device path is the stable by-id symlink so it survives ttyUSB
# renumbering.
[lircd]
nodaemon        = False
driver          = usb_uirt_raw
device          = /dev/serial/by-id/usb-FTDI_USB-UIRT-if00-port0
output          = /var/run/lirc/lircd
pidfile         = /var/run/lirc/lircd.pid
plugindir       = /usr/lib/x86_64-linux-gnu/lirc/plugins
permission      = 666
allow-simulate  = No
repeat-max      = 600

[lircmd]
uinput          = False
nodaemon        = False
