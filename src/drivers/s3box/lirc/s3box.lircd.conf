# S3BOX — ESP32-S3-BOX-3 IR remote.
#
# The BOX-3 transmits standard NEC with address 0x7C63. This address is
# deliberately different from the Vizio TV remote (0x20DF), so BOX-3 blasts
# are decoded by the USB-UIRT without also driving the TV.
#
# Canonical NEC timings (not irrecord's measured values) so lircd decodes
# every first frame cleanly. The BOX-3 side uses:
#   esphome.esp32_s3_box_3_send_ir(address=0x7C63, command=<code>, repeats=1)
# and its on_nec handler emits esphome.ir_received with remote=S3BOX.
#
# The BOX-3's NEC receiver sees these LIRC transmissions bit-reversed:
# address 0xC63E, KEY_OK 0x0005 -> 0xA000. Its ESPHome handler matches the
# reversed values so S3BOX buttons work in the Harmonia -> BOX-3 direction.

begin remote

  name  S3BOX
  bits           16
  flags SPACE_ENC|CONST_LENGTH
  eps            30
  aeps          100

  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat       9000  2250
  pre_data_bits  16
  pre_data       0x7C63
  gap          108000
  toggle_bit_mask 0x0
  frequency    38000

      begin codes
          KEY_UP                   0x0001
          KEY_DOWN                 0x0002
          KEY_LEFT                 0x0003
          KEY_RIGHT                0x0004
          KEY_OK                   0x0005
          KEY_BACK                 0x0006
          KEY_MENU                 0x0007
          KEY_PLAYPAUSE            0x0008
          KEY_VOLUMEUP             0x0009
          KEY_VOLUMEDOWN           0x000A
          KEY_MUTE                 0x000B
          KEY_POWER                0x000C
          KEY_HOME                 0x000D
      end codes

end remote
