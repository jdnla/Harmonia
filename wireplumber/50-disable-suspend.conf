# Keep ALSA audio sinks active (never suspend on idle) so audio doesn't take
# ~1-2s to resume when playback starts. session.suspend-timeout-seconds = 0
# disables the idle-suspend for matched nodes. Trivial power cost on an
# always-on HTPC; worth it for instant audio.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
