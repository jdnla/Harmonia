# Upmix stereo content to fill every speaker on the HDMI/AVR sink.
#
# Works with the channel-sync feature (channel_sync.py) which sets the sink to
# the receiver's max surround profile (e.g. 7.1). Without upmix, stereo sources
# would only feed front L/R and leave the surround/back channels silent. With
# channelmix.upmix enabled, PipeWire synthesizes center + LFE + rears from the
# stereo signal so all speakers are used.
#
# method "psd" = phase-based surround decoding (the good one — extracts ambience
# rather than just copying fronts to rears). LFE gets a low-passed sum.
#
# This receiver has NO center and NO subwoofer speaker (center=NO, sub=NO in the
# Denon speaker config), so the AVR folds the synthesized center into front L/R
# and redistributes LFE in hardware — we still send a standard 7.1 LPCM stream
# and let the receiver do the phantom-center fold.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
    ]
    actions = {
      update-props = {
        channelmix.upmix         = true
        channelmix.upmix-method  = "psd"
        channelmix.lfe-cutoff    = 120
        channelmix.fc-cutoff     = 12000
        channelmix.rear-delay    = 12.0
      }
    }
  }
]
