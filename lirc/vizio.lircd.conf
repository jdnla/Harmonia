# Vizio remote — canonical NEC config.
#
# The button codes below were captured from the actual remote via irrecord, but
# the timing parameters are the textbook NEC standard rather than irrecord's
# auto-measured values. irrecord's measured timings caused lircd to misclassify
# the first frame of each press as a repeat ("repeat code without last_code
# received"), so presses were dropped / mis-decoded. This remote is standard
# NEC (address 0x20DF), so the canonical NEC timings decode it reliably.

begin remote

  name  Vizio-jordan
  bits           16
  flags SPACE_ENC|CONST_LENGTH
  eps            30
  aeps          100

  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat       9000  2250
  pre_data_bits  16
  pre_data       0x20DF
  gap          108000
  toggle_bit_mask 0x0
  frequency    38000

      begin codes
          KEY_UP                   0xA25D
          KEY_DOWN                 0x629D
          KEY_LEFT                 0xE21D
          KEY_RIGHT                0x12ED
          KEY_OK                   0x22DD
          KEY_BACK                 0x52AD
          KEY_MENU                 0x58A7
          KEY_1                    0x8877
          KEY_2                    0x48B7
          KEY_3                    0xC837
          KEY_4                    0x28D7
          KEY_5                    0xA857
          KEY_6                    0x6897
          KEY_7                    0xE817
          KEY_8                    0x18E7
          KEY_9                    0x9867
          KEY_0                    0x08F7
      end codes

end remote
